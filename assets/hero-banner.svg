<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- 3D Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes float3D {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.85; }
        100% { transform: scale(0.9); opacity: 0.4; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes gradientShift {
        0% { stop-color: #818cf8; }
        50% { stop-color: #f472b6; }
        100% { stop-color: #818cf8; }
      }
      .cube-float {
        transform-origin: 750px 150px;
        animation: float3D 5s ease-in-out infinite;
      }
      .ring-pulse {
        transform-origin: 750px 150px;
        animation: pulseRing 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .star-1 { animation: starTwinkle 3s ease-in-out infinite; }
      .star-2 { animation: starTwinkle 4s ease-in-out infinite 1s; }
      .star-3 { animation: starTwinkle 3.5s ease-in-out infinite 2s; }
      .text-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .text-mono {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="300" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Cybernetic Grid Overlay -->
  <g stroke="rgba(99, 102, 241, 0.08)" stroke-width="1">
    <line x1="0" y1="50" x2="920" y2="50" />
    <line x1="0" y1="100" x2="920" y2="100" />
    <line x1="0" y1="150" x2="920" y2="150" />
    <line x1="0" y1="200" x2="920" y2="200" />
    <line x1="0" y1="250" x2="920" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="url(#intenseGlow)"/>
  <circle cx="750" cy="150" r="160" fill="#ec4899" opacity="0.15" filter="url(#intenseGlow)"/>

  <!-- Animated Neural Connector Stream -->
  <g fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4">
    <path class="flow-line" d="M 60,150 Q 250,70 450,150 T 700,150" />
    <path class="flow-line" d="M 60,200 Q 280,240 500,170 T 720,130" stroke="#a78bfa" />
  </g>

  <!-- Twinkling Floating Stars -->
  <g fill="#a78bfa">
    <circle cx="120" cy="60" r="2" class="star-1" />
    <circle cx="480" cy="40" r="2.5" class="star-2" fill="#f472b6" />
    <circle cx="560" cy="220" r="2" class="star-3" />
    <circle cx="280" cy="260" r="1.5" class="star-1" />
    <circle cx="850" cy="50" r="2.5" class="star-2" fill="#38bdf8" />
  </g>

  <!-- Left Content: Titles & Badges -->
  <g transform="translate(60, 48)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="240" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10b981"/>
    <text x="28" y="18" fill="#c7d2fe" font-size="11" font-weight="600" class="text-mono">v2.0 • GEMINI 1.5 PRO READY</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#titleGrad)" font-size="38" class="text-title" filter="url(#neonGlow)">
      GEMINI SMARTNOTES
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#cbd5e1" font-size="16" font-family="'Inter', sans-serif" font-weight="400">
      Next-Gen AI Study Assistant &amp; Interactive Learning Suite
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 138)">
      <!-- Tag 1: Explanations -->
      <g transform="translate(0, 0)">
        <rect width="115" height="26" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
        <text x="10" y="17" fill="#a5b4fc" font-size="11" font-weight="600" class="text-mono">📚 Explanations</text>
      </g>
      <!-- Tag 2: Quizzes -->
      <g transform="translate(125, 0)">
        <rect width="110" height="26" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
        <text x="10" y="17" fill="#a5b4fc" font-size="11" font-weight="600" class="text-mono">🎯 MCQs &amp; Quiz</text>
      </g>
      <!-- Tag 3: Q&A -->
      <g transform="translate(245, 0)">
        <rect width="105" height="26" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
        <text x="10" y="17" fill="#a5b4fc" font-size="11" font-weight="600" class="text-mono">❓ Deep Q&amp;A</text>
      </g>
      <!-- Tag 4: PDF -->
      <g transform="translate(360, 0)">
        <rect width="100" height="26" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
        <text x="10" y="17" fill="#a5b4fc" font-size="11" font-weight="600" class="text-mono">📄 PDF Studio</text>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <text x="0" y="206" fill="#64748b" font-size="12" class="text-mono">
      ⚡ 0.04s Execution • 🛡️ Zero-Leak Credential Security • 🌓 Dark/Light Mode
    </text>
  </g>

  <!-- Right Content: Interactive 3D Isometric Crystal Cube -->
  <g class="ring-pulse">
    <!-- Orbital Glow Ring -->
    <ellipse cx="750" cy="150" rx="90" ry="40" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-20, 750, 150)"/>
    <ellipse cx="750" cy="150" rx="110" ry="50" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="12 8" opacity="0.4" transform="rotate(35, 750, 150)"/>
  </g>

  <g class="cube-float" filter="url(#neonGlow)">
    <!-- 3D Cube Isometric Coordinates centered at (750, 150) -->
    <!-- Top Face -->
    <polygon points="750,90 815,125 750,160 685,125" fill="url(#cubeTop)" stroke="#c4b5fd" stroke-width="1.2"/>
    
    <!-- Left Face -->
    <polygon points="685,125 750,160 750,230 685,195" fill="url(#cubeLeft)" stroke="#818cf8" stroke-width="1"/>

    <!-- Right Face -->
    <polygon points="750,160 815,125 815,195 750,230" fill="url(#cubeRight)" stroke="#c084fc" stroke-width="1"/>

    <!-- Center Floating Core Spark -->
    <circle cx="750" cy="160" r="5" fill="#ffffff" filter="url(#neonGlow)"/>
    
    <!-- Edge Specular Lines -->
    <line x1="750" y1="90" x2="750" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Small floating satellite nodes -->
  <g>
    <circle cx="660" cy="85" r="7" fill="#6366f1" filter="url(#neonGlow)"/>
    <circle cx="840" cy="210" r="6" fill="#ec4899" filter="url(#neonGlow)"/>
    <circle cx="830" cy="80" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <line x1="660" y1="85" x2="685" y2="125" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="840" y1="210" x2="815" y2="195" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>
</svg>
