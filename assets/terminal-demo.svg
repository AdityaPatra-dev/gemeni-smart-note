<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style><![CDATA[
      /* Cursor Blink */
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blinkCursor 0.9s infinite;
      }

      /* Clean Sequential Opacity-Only Fade (Zero Transform Overrides) */
      @keyframes fadeStep {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .step-1 { animation: fadeStep 0.3s ease forwards 0.2s; opacity: 0; }
      .step-2 { animation: fadeStep 0.3s ease forwards 0.5s; opacity: 0; }
      .step-3 { animation: fadeStep 0.3s ease forwards 0.8s; opacity: 0; }
      .step-4 { animation: fadeStep 0.3s ease forwards 1.1s; opacity: 0; }
      .step-5 { animation: fadeStep 0.3s ease forwards 1.4s; opacity: 0; }
      .step-6 { animation: fadeStep 0.3s ease forwards 1.7s; opacity: 0; }
      .step-7 { animation: fadeStep 0.3s ease forwards 2.0s; opacity: 0; }
      .step-8 { animation: fadeStep 0.3s ease forwards 2.3s; opacity: 0; }

      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
      }
    ]]></style>
  </defs>

  <!-- Outer Window Container -->
  <rect x="0" y="0" width="880" height="430" rx="14" fill="url(#termBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="880" height="40" rx="14" fill="url(#termHeader)"/>
  <rect x="0" y="24" width="880" height="16" fill="url(#termHeader)"/>
  <line x1="0" y1="40" x2="880" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- Traffic Light Window Buttons -->
  <circle cx="22" cy="20" r="6" fill="#ef4444"/>
  <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="20" r="6" fill="#10b981"/>

  <!-- Terminal Window Title -->
  <text x="440" y="25" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    gemini-smartnotes-cli — session v2.0
  </text>

  <!-- Terminal Content Lines: Fully Static Y Positions, Zero Overlaps -->
  <g class="mono-text">
    
    <!-- Line 1: User Command (y=75) -->
    <g class="step-1">
      <text x="28" y="75" fill="#38bdf8" font-weight="700">user@ai-lab</text>
      <text x="118" y="75" fill="#64748b">:</text>
      <text x="130" y="75" fill="#a78bfa">~/gemeni-smart-note</text>
      <text x="290" y="75" fill="#f8fafc">$</text>
      <text x="308" y="75" fill="#f8fafc" font-weight="600">python3 main.py --topic "Distributed Systems"</text>
    </g>

    <!-- Line 2: System Boot (y=115) -->
    <g class="step-2">
      <rect x="28" y="99" width="88" height="22" rx="4" fill="#1e1b4b"/>
      <text x="36" y="115" fill="#818cf8" font-weight="700">[SYSTEM]</text>
      <text x="126" y="115" fill="#cbd5e1">Booting Gemini SmartNotes Engine Core...</text>
      <rect x="735" y="99" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="115" fill="#34d399" font-weight="700">✓ ONLINE (0.01s)</text>
    </g>

    <!-- Line 3: AI Engine Connection (y=155) -->
    <g class="step-3">
      <rect x="28" y="139" width="88" height="22" rx="4" fill="#31104b"/>
      <text x="36" y="155" fill="#c084fc" font-weight="700">[ENGINE]</text>
      <text x="126" y="155" fill="#cbd5e1">Connected: </text>
      <text x="215" y="155" fill="#38bdf8" font-weight="600" filter="url(#cyanGlow)">google/gemini-1.5-flash</text>
      <rect x="735" y="139" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="155" fill="#34d399" font-weight="700">✓ ZERO-LEAK</text>
    </g>

    <!-- Line 4: Explanation Generation (y=195) -->
    <g class="step-4">
      <rect x="28" y="179" width="88" height="22" rx="4" fill="#064e3b"/>
      <text x="36" y="195" fill="#34d399" font-weight="700">[EXPLAIN]</text>
      <text x="126" y="195" fill="#e2e8f0">Synthesizing topic explanation (Advanced)...</text>
      <rect x="735" y="179" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="195" fill="#34d399" font-weight="700">✓ 1,480 WORDS</text>
    </g>

    <!-- Line 5: Interactive MCQs (y=235) -->
    <g class="step-5">
      <rect x="28" y="219" width="88" height="22" rx="4" fill="#451a03"/>
      <text x="36" y="235" fill="#fbbf24" font-weight="700">[QUIZ]</text>
      <text x="126" y="235" fill="#e2e8f0">Generating 5 self-grading MCQs + reasoning...</text>
      <rect x="735" y="219" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="235" fill="#34d399" font-weight="700">✓ 5 MCQS READY</text>
    </g>

    <!-- Line 6: Doubts & Q&A (y=275) -->
    <g class="step-6">
      <rect x="28" y="259" width="88" height="22" rx="4" fill="#4a044e"/>
      <text x="36" y="275" fill="#f472b6" font-weight="700">[DOUBTS]</text>
      <text x="126" y="275" fill="#e2e8f0">Resolving CAP Theorem &amp; Consensus queries...</text>
      <rect x="735" y="259" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="275" fill="#34d399" font-weight="700">✓ 4 ACCORDIONS</text>
    </g>

    <!-- Line 7: PDF Compilation (y=315) -->
    <g class="step-7">
      <rect x="28" y="299" width="88" height="22" rx="4" fill="#1e293b"/>
      <text x="36" y="315" fill="#38bdf8" font-weight="700">[PDF]</text>
      <text x="126" y="315" fill="#e2e8f0">ReportLab: </text>
      <text x="215" y="315" fill="#a78bfa">generated/Distributed_Systems.pdf</text>
      <rect x="735" y="299" width="115" height="22" rx="4" fill="#064e3b"/>
      <text x="745" y="315" fill="#34d399" font-weight="700">✓ 4 PAGES .PDF</text>
    </g>

    <!-- Line 8: Ready Status (y=365) -->
    <g class="step-8">
      <text x="28" y="365" fill="#10b981" font-weight="700" font-size="14">🚀 STATUS:</text>
      <text x="110" y="365" fill="#f8fafc" font-size="14">Server active at </text>
      <text x="240" y="365" fill="#38bdf8" font-weight="700" font-size="14" text-decoration="underline">http://localhost:8000</text>
      <rect x="430" y="352" width="10" height="17" fill="#10b981" class="cursor"/>
    </g>

  </g>
</svg>
