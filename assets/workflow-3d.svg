<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" height="auto">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="neonGlowWF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style><![CDATA[
      /* Smooth Data Flow Animation (Stroke-dashoffset only, ZERO transform overrides) */
      @keyframes dashFlow {
        to { stroke-dashoffset: -56; }
      }
      .pipe-pulse {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.8s linear infinite;
      }

      /* Core Pulsing Filter (Opacity and filter only, ZERO transform overrides) */
      @keyframes coreGlowPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .core-glow-layer {
        animation: coreGlowPulse 3s ease-in-out infinite;
      }

      .font-sans {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    ]]></style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="980" height="400" rx="16" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="rgba(99, 102, 241, 0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="980" y2="100"/>
    <line x1="0" y1="200" x2="980" y2="200"/>
    <line x1="0" y1="300" x2="980" y2="300"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="470" y1="0" x2="470" y2="400"/>
    <line x1="680" y1="0" x2="680" y2="400"/>
  </g>

  <!-- ==================== CONNECTING DATA PIPES ==================== -->
  <!-- Pipe 1: User Node -> Core Input (Static Y=200) -->
  <path d="M 210,200 L 400,200" fill="none" stroke="#1e293b" stroke-width="5"/>
  <path class="pipe-pulse" d="M 210,200 L 400,200" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Pipe 2A: Core Output -> Card 1 (Top, Y=62) -->
  <path d="M 540,200 C 600,200 610,62 680,62" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path class="pipe-pulse" d="M 540,200 C 600,200 610,62 680,62" fill="none" stroke="#818cf8" stroke-width="2.5"/>

  <!-- Pipe 2B: Core Output -> Card 2 (Upper-Mid, Y=152) -->
  <path d="M 540,200 C 600,200 610,152 680,152" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path class="pipe-pulse" d="M 540,200 C 600,200 610,152 680,152" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <!-- Pipe 2C: Core Output -> Card 3 (Lower-Mid, Y=242) -->
  <path d="M 540,200 C 600,200 610,242 680,242" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path class="pipe-pulse" d="M 540,200 C 600,200 610,242 680,242" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Pipe 2D: Core Output -> Card 4 (Bottom, Y=332) -->
  <path d="M 540,200 C 600,200 610,332 680,332" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path class="pipe-pulse" d="M 540,200 C 600,200 610,332 680,332" fill="none" stroke="#f472b6" stroke-width="2.5"/>


  <!-- ==================== LEFT: USER PROMPT NODE ==================== -->
  <g transform="translate(30, 130)">
    <rect width="180" height="140" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#neonGlowWF)"/>
    
    <!-- User Avatar Icon -->
    <circle cx="90" cy="38" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="44" fill="#38bdf8" font-size="18" text-anchor="middle">👤</text>
    
    <!-- Topic Labels -->
    <text x="90" y="78" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">USER PROMPT</text>
    <text x="90" y="98" fill="#94a3b8" font-size="11" class="font-mono" text-anchor="middle">"Distributed Systems"</text>
    
    <!-- Difficulty Pill -->
    <rect x="30" y="108" width="120" height="18" rx="9" fill="#1e3a8a"/>
    <text x="90" y="121" fill="#bfdbfe" font-size="9" font-weight="700" class="font-mono" text-anchor="middle">LEVEL: ADVANCED</text>

    <!-- Outbound Port -->
    <circle cx="180" cy="70" r="5" fill="#38bdf8"/>
  </g>


  <!-- ==================== CENTER: GEMINI NEURAL CORE ==================== -->
  <g transform="translate(470, 200)">
    <!-- Glow Hex Layer -->
    <g class="core-glow-layer">
      <!-- Outer Hexagon -->
      <polygon points="0,-56 48,-28 48,28 0,56 -48,28 -48,-28" fill="url(#coreGrad)" stroke="#c4b5fd" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.95" filter="url(#neonGlowWF)"/>
      <text x="0" y="4" fill="#4c1d95" font-size="10" font-weight="800" text-anchor="middle" class="font-mono">AI</text>
    </g>

    <!-- Inbound & Outbound Ports on Core -->
    <circle cx="-70" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="70" cy="0" r="5" fill="#c084fc"/>

    <!-- Core Labels (Safely positioned above and below core with no crossing lines) -->
    <text x="0" y="-74" fill="#e0e7ff" font-size="13" font-weight="800" text-anchor="middle" class="font-sans">GEMINI 1.5 PRO</text>
    <text x="0" y="80" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">NEURAL REASONING</text>
  </g>


  <!-- ==================== RIGHT: 4 ARTIFACT CARDS ==================== -->
  <!-- Card 1: Adaptive Explanation (Y=30..95) -->
  <g transform="translate(680, 30)">
    <rect width="260" height="64" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="32" r="5" fill="#818cf8"/> <!-- Inbound Port -->
    
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#1e1b4b"/>
    <text x="32" y="37" fill="#a5b4fc" font-size="16" text-anchor="middle">📚</text>
    <text x="60" y="30" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Adaptive Explanation</text>
    <text x="60" y="46" fill="#818cf8" font-size="10" class="font-mono">1,480 Words • Structured</text>
  </g>

  <!-- Card 2: Interactive MCQs (Y=120..185) -->
  <g transform="translate(680, 120)">
    <rect width="260" height="64" rx="10" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="0" cy="32" r="5" fill="#34d399"/> <!-- Inbound Port -->
    
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#064e3b"/>
    <text x="32" y="37" fill="#6ee7b7" font-size="16" text-anchor="middle">🎯</text>
    <text x="60" y="30" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Self-Grading MCQs</text>
    <text x="60" y="46" fill="#34d399" font-size="10" class="font-mono">5 Questions • Instant Score</text>
  </g>

  <!-- Card 3: Deep Doubts Q&A (Y=210..275) -->
  <g transform="translate(680, 210)">
    <rect width="260" height="64" rx="10" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="0" cy="32" r="5" fill="#fbbf24"/> <!-- Inbound Port -->
    
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#451a03"/>
    <text x="32" y="37" fill="#fde68a" font-size="16" text-anchor="middle">❓</text>
    <text x="60" y="30" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Deep Doubts &amp; Q&amp;A</text>
    <text x="60" y="46" fill="#fbbf24" font-size="10" class="font-mono">4 Interactive Accordions</text>
  </g>

  <!-- Card 4: ReportLab PDF (Y=300..365) -->
  <g transform="translate(680, 300)">
    <rect width="260" height="64" rx="10" fill="#111827" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="0" cy="32" r="5" fill="#f472b6"/> <!-- Inbound Port -->
    
    <rect x="14" y="14" width="36" height="36" rx="8" fill="#4a044e"/>
    <text x="32" y="37" fill="#fbcfe8" font-size="16" text-anchor="middle">📄</text>
    <text x="60" y="30" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">ReportLab PDF Studio</text>
    <text x="60" y="46" fill="#f472b6" font-size="10" class="font-mono">4-Page Publication .pdf</text>
  </g>

</svg>
